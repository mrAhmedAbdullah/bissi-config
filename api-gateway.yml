server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        - id: bissi-core-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/diaries/**,/api/v1/transactions/**
        - id: bissi-audit-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/audits/**